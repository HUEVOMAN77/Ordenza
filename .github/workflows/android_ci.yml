name: Android CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EINSEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EINSEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        env:
          EINSEN_KEYSTORE_PASSWORD: ${{ secrets.EINSEN_KEYSTORE_PASSWORD }}
          EINSEN_KEY_ALIAS: ${{ secrets.EINSEN_KEY_ALIAS }}
          EINSEN_KEY_PASSWORD: ${{ secrets.EINSEN_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Ordenza-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Ordenza-release.apk
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ordenza-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (master branch)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create master-latest dist/Ordenza-release.apk dist/Ordenza-debug.apk \
            --title "Ordenza Master Build" \
            --notes "Auto-generated release from master branch push.\n\n- Release APK: dist/Ordenza-release.apk\n- Debug APK: dist/Ordenza-debug.apk" \
            --latest 2>/dev/null || gh release upload master-latest dist/Ordenza-release.apk dist/Ordenza-debug.apk --clobber

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

  emulator-test:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            ./gradlew installDebug
            adb shell am start -W -n io.github.huevoman77.ordenza.debug/dev.spikeysanju.einsen.MainActivity
            adb exec-out screencap -p > screenshots/1-launch.png
            sleep 5
            adb exec-out screencap -p > screenshots/2-dashboard.png
            adb shell input tap 1006 137
            sleep 3
            adb exec-out screencap -p > screenshots/3-about.png
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell input swipe 540 2000 540 700 600
            sleep 4
            adb exec-out screencap -p > screenshots/4-app-drawer.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/
          retention-days: 14
